[package]
name = "vnc-rs"
version = "0.6.0"
edition = "2021"
authors = [
    "Jovi Hsu <jv.hsu@outlook.com>",
    "Petr Beneš <petr.benes@gendigital.com>",
    "Djamel TORCHE <djamel.torche@gmail.com>",
    "Peter Rekdal Khan-Sunde <peter.sunde@gmail.com>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/HsuJv/vnc-rs"
homepage = "https://github.com/HsuJv/vnc-rs"
documentation = "https://docs.rs/vnc-rs"
description = "An async implementation of VNC client side protocol"
keywords = ["vnc"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vnc"
path = "src/lib.rs"

[features]
default = ["auth-ard", "auth-vnc", "encoding-tight", "encoding-zrle", "encoding-trle", "cursor", "desktop-resize"]
auth-ard = ["dep:num-bigint", "dep:md-5", "dep:aes", "dep:getrandom"]
auth-vnc = []
encoding-tight = ["dep:flate2"]
encoding-zrle = ["dep:flate2"]
encoding-trle = []
cursor = []
desktop-resize = ["tokio/time"]

[dependencies]
#error
thiserror = "^1"
flate2 = { version = "^1", optional = true }

#log
tracing = { version = "^0.1", features = ["log"] }

# async
tokio = { version = "^1", default-features = false, features = ["sync", "macros", "io-util", "rt"] }
async_io_stream = "0.3"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = { version = "0.1", default-features = false }

# Apple ARD authentication (RFB security type 30)
num-bigint = { version = "0.4", optional = true }
md-5 = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
getrandom = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", optional = true, features = ["js"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { version = "^1", features = ["net", "rt-multi-thread", "time"] }
anyhow = "^1"
tracing-subscriber = { version = "^0.3" }
minifb = "0.25.0"


[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
